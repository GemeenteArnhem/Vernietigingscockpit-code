# Acceptatieomgeving voor lokaal testen in Docker Desktop: de volledige cockpit (web, API,
# worker), PostgreSQL, Keycloak, Gotenberg, de teststekker en de OpenZaak-stekker met een eigen
# Open Zaak. Alleen testgegevens; niet voor productie. Wachtwoorden en secrets staan in .env naast dit bestand (niet in git), gemaakt
# met init-geheimen.mjs (zie README.md in deze map).
#
#   node infrastructure/acceptatie/init-geheimen.mjs
#   docker compose -f infrastructure/acceptatie/docker-compose.yml up -d --build
#
# Adressen: lokaal (standaard) web op http://localhost:8480, API op :8481, Open Zaak-beheer op
# http://localhost:8483/admin/ en Keycloak op http://host.docker.internal:8482 (voor browser én containers gelijk, zodat de issuer in de
# tokens overal klopt; Docker Desktop zet die naam in het hosts-bestand van Windows).
# Op een server: ACC_WEB_URL, ACC_API_URL en ACC_AUTH_URL in .env (https-domeinen) en
# docker-compose.vm.yml erbij voor Traefik; zie README.md.

name: vernietigingscockpit-acceptatie

x-keycloak-issuer: &issuer ${ACC_AUTH_URL:-http://host.docker.internal:8482}/realms/vernietigingscockpit
# Alleen voor `prisma generate` tijdens de build; er wordt geen verbinding gemaakt.
x-prisma-generate: &prisma-generate postgresql://prisma:prisma@localhost:5432/prisma?schema=public

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: ${ACC_DB_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}
      POSTGRES_DB: cockpit
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ACC_KEYCLOAK_ADMIN_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}
      KC_HOSTNAME: ${ACC_AUTH_URL:-http://host.docker.internal:8482}
      # Achter een reverse proxy (Traefik): X-Forwarded-headers volgen.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8482:8080"
    volumes:
      # Accounts en hun id's blijven bewaard; de realm wordt alleen bij de eerste start ingelezen.
      - keycloak:/opt/keycloak/data
      - ./keycloak/vernietigingscockpit-realm.json:/opt/keycloak/data/import/vernietigingscockpit-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  # Bij elke start: wachtwoorden van de testgebruikers en het client-secret van cockpit-stekker
  # uit .env zetten, en de scopes van de Stekker-API aan die client koppelen.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.3
    entrypoint: ["/bin/bash", "/init/keycloak-init.sh"]
    environment:
      KC_ADMIN: admin
      KC_ADMIN_PASSWORD: ${ACC_KEYCLOAK_ADMIN_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}
      GEBRUIKERS_WACHTWOORD: ${ACC_GEBRUIKERS_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}
      STEKKER_GEHEIM: ${ACC_STEKKER_GEHEIM:?maak eerst .env met init-geheimen.mjs}
      WEB_URL: ${ACC_WEB_URL:-http://localhost:8480}
      OPENZAAK_STEKKER_GEHEIM: ${ACC_OPENZAAK_STEKKER_GEHEIM:?maak eerst .env met init-geheimen.mjs}
    volumes:
      - ./keycloak/keycloak-init.sh:/init/keycloak-init.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy

  gotenberg:
    image: gotenberg/gotenberg:8
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # De teststekker, gebouwd uit de checkout naast deze repo (of STEKKER_REPO).
  stekker:
    build:
      context: ${STEKKER_REPO:-../../../Vernietigingscockpit-stekker-test}
    environment:
      AUTH_ENABLED: "true"
      AUTH_ISSUER: *issuer
      AUTH_JWKS_URL: ${ACC_AUTH_URL:-http://host.docker.internal:8482}/realms/vernietigingscockpit/protocol/openid-connect/certs
      AUTH_AUDIENCE: teststekker
      SELECTIE_PROCESSING_DELAY_MS: "2000"
      VERNIETIGING_PROCESSING_DELAY_MS: "2000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - stekker-data:/app/runtime
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Open Zaak (1.30.0) met de OpenZaak-stekker -------------------------------------------
  # Eigen database en Redis. Beheer op :8483 (gebruiker admin, ACC_OPENZAAK_ADMIN_WACHTWOORD).
  # Binnen het Docker-netwerk heet Open Zaak openzaak.acceptatie.local: Open Zaak keurt URL's
  # zonder punt in de hostnaam (zoals http://openzaak:8000) af als ongeldig. De URL's in Open
  # Zaak volgen het adres waarmee ze worden opgevraagd.
  openzaak-db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: openzaak
      POSTGRES_USER: openzaak
      POSTGRES_PASSWORD: ${ACC_OPENZAAK_DB_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}
    volumes:
      - openzaak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openzaak -d openzaak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  openzaak-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  openzaak:
    image: openzaak/open-zaak:1.30.0
    environment: &openzaak-env
      DJANGO_SETTINGS_MODULE: openzaak.conf.docker
      SECRET_KEY: ${ACC_OPENZAAK_SECRET_KEY:?maak eerst .env met init-geheimen.mjs}
      DB_HOST: openzaak-db
      DB_NAME: openzaak
      DB_USER: openzaak
      DB_PASSWORD: ${ACC_OPENZAAK_DB_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}
      ALLOWED_HOSTS: "*"
      CACHE_DEFAULT: openzaak-redis:6379/0
      CACHE_AXES: openzaak-redis:6379/0
      CELERY_BROKER_URL: redis://openzaak-redis:6379/1
      CELERY_RESULT_BACKEND: redis://openzaak-redis:6379/1
      NOTIFICATIONS_DISABLED: "true"
      DISABLE_2FA: "true"
      IS_HTTPS: ${ACC_OPENZAAK_HTTPS:-false}
      # Geen OpenTelemetry-collector in deze opzet; anders blijft het exporteren hangen.
      OTEL_SDK_DISABLED: "True"
      OPENZAAK_SUPERUSER_USERNAME: admin
      OPENZAAK_SUPERUSER_EMAIL: admin@example.test
      DJANGO_SUPERUSER_PASSWORD: ${ACC_OPENZAAK_ADMIN_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}
      UWSGI_PROCESSES: "2"
      UWSGI_THREADS: "4"
    ports:
      - "8483:8000"
    networks:
      default:
        aliases:
          - openzaak.acceptatie.local
    depends_on:
      openzaak-db:
        condition: service_healthy
      openzaak-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/zaken/api/v1/', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
    restart: unless-stopped

  # Bij elke start: inloggegevens van het seed-account en de stekker, en de applicatie van het
  # seed-account (alle rechten). setup_configuration is idempotent.
  openzaak-init:
    image: openzaak/open-zaak:1.30.0
    environment:
      <<: *openzaak-env
      SEED_SECRET: ${ACC_OPENZAAK_SEED_SECRET:?maak eerst .env met init-geheimen.mjs}
      STEKKER_SECRET: ${ACC_OPENZAAK_STEKKER_SECRET:?maak eerst .env met init-geheimen.mjs}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cat > /tmp/setup.yaml <<EOF
        vng_api_common_credentials_config_enable: true
        vng_api_common_credentials:
          items:
            - identifier: vernietigingscockpit-seed
              secret: $${SEED_SECRET}
            - identifier: vernietigingscockpit-stekker
              secret: $${STEKKER_SECRET}
        vng_api_common_applicaties_config_enable: true
        vng_api_common_applicaties:
          items:
            - uuid: 7a2d1c8e-0f3b-4c5d-9e6f-a1b2c3d4e5f6
              client_ids:
                - vernietigingscockpit-seed
              label: Vernietigingscockpit seed (testgegevens)
              heeft_alle_autorisaties: true
        EOF
        cd /app && src/manage.py setup_configuration --yaml-file /tmp/setup.yaml
    depends_on:
      openzaak:
        condition: service_healthy

  # Bij elke start (idempotent): catalogus, zaaktype en voorbeeldzaken in Open Zaak, en de
  # applicatie van de stekker met alleen lees- en verwijderrechten. Het script komt uit de
  # stekkerrepo (scripts/seed-openzaak.mjs) en heeft internet nodig (Selectielijst API).
  openzaak-seed:
    build:
      context: ${STEKKER_OPENZAAK_REPO:-../../../Vernietigingscockpit-stekker-openzaak}
    image: vernietigingscockpit-stekker-openzaak:acceptatie
    command: ["node", "scripts/seed-openzaak.mjs", "--aantal", "20"]
    environment:
      OPENZAAK_URL: http://openzaak.acceptatie.local:8000
      OPENZAAK_SEED_CLIENT_ID: vernietigingscockpit-seed
      OPENZAAK_SEED_SECRET: ${ACC_OPENZAAK_SEED_SECRET:?maak eerst .env met init-geheimen.mjs}
      OPENZAAK_CLIENT_ID: vernietigingscockpit-stekker
    depends_on:
      openzaak-init:
        condition: service_completed_successfully

  # De OpenZaak-stekker, gebouwd uit de checkout naast deze repo (of STEKKER_OPENZAAK_REPO).
  stekker-openzaak:
    image: vernietigingscockpit-stekker-openzaak:acceptatie
    pull_policy: never
    environment:
      AUTH_ENABLED: "true"
      AUTH_ISSUER: *issuer
      AUTH_JWKS_URL: ${ACC_AUTH_URL:-http://host.docker.internal:8482}/realms/vernietigingscockpit/protocol/openid-connect/certs
      AUTH_AUDIENCE: openzaak-stekker
      OPENZAAK_ZAKEN_URL: http://openzaak.acceptatie.local:8000/zaken/api/v1/
      OPENZAAK_DOCUMENTEN_URL: http://openzaak.acceptatie.local:8000/documenten/api/v1/
      OPENZAAK_BESLUITEN_URL: http://openzaak.acceptatie.local:8000/besluiten/api/v1/
      OPENZAAK_CATALOGI_URL: http://openzaak.acceptatie.local:8000/catalogi/api/v1/
      OPENZAAK_CLIENT_ID: vernietigingscockpit-stekker
      OPENZAAK_SECRET: ${ACC_OPENZAAK_STEKKER_SECRET:?maak eerst .env met init-geheimen.mjs}
      STEKKER_NAAM: OpenZaak-stekker (acceptatie)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - stekker-openzaak-data:/app/runtime
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
      openzaak-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: cockpit-migrate
      args:
        PRISMA_GENERATE_DATABASE_URL: *prisma-generate
    image: vernietigingscockpit-migrate:acceptatie
    environment:
      DATABASE_URL: postgresql://cockpit:${ACC_DB_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}@db:5432/cockpit?schema=public&sslmode=disable
      APP_DB_USER: cockpit_api
      APP_DB_PASSWORD: ${ACC_DB_APP_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}
    depends_on:
      db:
        condition: service_healthy

  # Testgegevens: medewerkers rm1/po1/arch1, de teststekker (OAuth2 via Keycloak) en een
  # taakdefinitie. Idempotent; draait bij elke start na de migraties.
  seed:
    image: vernietigingscockpit-migrate:acceptatie
    pull_policy: never
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgresql://cockpit:${ACC_DB_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}@db:5432/cockpit?schema=public&sslmode=disable
      SEED_STEKKER_BASE_URL: http://stekker:3000
      SEED_STEKKER_AUTH_TYPE: oauth2_cc
      SEED_STEKKER_TOKEN_URL: ${ACC_AUTH_URL:-http://host.docker.internal:8482}/realms/vernietigingscockpit/protocol/openid-connect/token
      SEED_STEKKER_CLIENT_ID: cockpit-stekker
      SEED_STEKKER_SECRET_REF: KC_STEKKER_CLIENT_SECRET
      # Tweede stekker + taakdefinitie 'Zaken OpenZaak' (alleen als de base-URL is gezet).
      SEED_OPENZAAK_STEKKER_BASE_URL: http://stekker-openzaak:3000
      SEED_OPENZAAK_STEKKER_TOKEN_URL: ${ACC_AUTH_URL:-http://host.docker.internal:8482}/realms/vernietigingscockpit/protocol/openid-connect/token
      SEED_OPENZAAK_STEKKER_CLIENT_ID: cockpit-stekker-openzaak
      SEED_OPENZAAK_STEKKER_SECRET_REF: KC_OPENZAAK_STEKKER_CLIENT_SECRET
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: cockpit-api
      args:
        PRISMA_GENERATE_DATABASE_URL: *prisma-generate
    image: vernietigingscockpit-api:acceptatie
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://cockpit_api:${ACC_DB_APP_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}@db:5432/cockpit?schema=public&sslmode=disable
      OIDC_ISSUER: *issuer
      OIDC_AUDIENCE: cockpit-api
      CORS_ORIGIN: ${ACC_WEB_URL:-http://localhost:8480}
      SECRET_ENCRYPTION_KEY: ${ACC_SECRET_SLEUTEL:?maak eerst .env met init-geheimen.mjs}
      SELECTIE_WORKER_ENABLED: "false"
      LOG_LEVEL: info
    ports:
      - "8481:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      seed:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  worker:
    image: vernietigingscockpit-api:acceptatie
    pull_policy: never
    command: ["node", "dist/worker.js"]
    environment:
      WORKER_ID: worker-acceptatie
      DATABASE_URL: postgresql://cockpit_api:${ACC_DB_APP_WACHTWOORD:?maak eerst .env met init-geheimen.mjs}@db:5432/cockpit?schema=public&sslmode=disable
      SELECTIE_WORKER_INTERVAL_MS: "2000"
      WORKER_LEASE_MS: "300000"
      WORKER_BACKOFF_START_MS: "2000"
      WORKER_BACKOFF_MAX_MS: "30000"
      WORKER_POLL_START_MS: "2000"
      WORKER_POLL_MAX_MS: "10000"
      # Zelfde waarde als het client-secret dat keycloak-init op cockpit-stekker zet.
      KC_STEKKER_CLIENT_SECRET: ${ACC_STEKKER_GEHEIM:?maak eerst .env met init-geheimen.mjs}
      # Idem voor cockpit-stekker-openzaak (de OpenZaak-stekker).
      KC_OPENZAAK_STEKKER_CLIENT_SECRET: ${ACC_OPENZAAK_STEKKER_GEHEIM:?maak eerst .env met init-geheimen.mjs}
      SECRET_ENCRYPTION_KEY: ${ACC_SECRET_SLEUTEL:?maak eerst .env met init-geheimen.mjs}
      GOTENBERG_URL: http://gotenberg:3000
      ARCHIEF_PAD: /archief
      # ADR-0006: beginwaarde bewaartermijn werkkopie en interval van de opschoning.
      WERKKOPIE_BEWAARTERMIJN: ${WERKKOPIE_BEWAARTERMIJN:-P12M}
      OPSCHONING_INTERVAL: ${OPSCHONING_INTERVAL:-P1D}
      LOG_LEVEL: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - archief:/archief
    depends_on:
      api:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      stekker:
        condition: service_healthy
      stekker-openzaak:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: cockpit-web
      args:
        VITE_OIDC_AUTHORITY: *issuer
        VITE_OIDC_CLIENT_ID: cockpit-web
        VITE_OIDC_REDIRECT_URI: ${ACC_WEB_URL:-http://localhost:8480}/auth/callback
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${ACC_WEB_URL:-http://localhost:8480}
        VITE_OIDC_SCOPE: openid profile email
        VITE_API_BASE_URL: ${ACC_API_URL:-http://localhost:8481}/api/v1
    image: vernietigingscockpit-web:acceptatie
    environment:
      WEB_OIDC_AUTHORITY: *issuer
      WEB_API_BASE_URL: ${ACC_API_URL:-http://localhost:8481}/api/v1
    ports:
      - "8480:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
  keycloak:
  archief:
  stekker-data:
  openzaak-db:
  stekker-openzaak-data:
