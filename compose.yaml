services:
  # Eenmalig bij elke `docker compose up` (CC-14): migraties en de loginrol van de API,
  # als eigenaar van de database. De API start pas als dit is gelukt.
  cockpit-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: cockpit-migrate
      args:
        PRISMA_GENERATE_DATABASE_URL: ${PRISMA_GENERATE_DATABASE_URL:?PRISMA_GENERATE_DATABASE_URL is required}
    image: vernietigingscockpit-migrate:local
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?MIGRATE_DATABASE_URL is required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    networks:
      - database
    restart: "no"

  cockpit-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: cockpit-api
      args:
        PRISMA_GENERATE_DATABASE_URL: ${PRISMA_GENERATE_DATABASE_URL:?PRISMA_GENERATE_DATABASE_URL is required}
    image: vernietigingscockpit-api:local
    container_name: ${API_CONTAINER_NAME:-cockpit-api}
    depends_on:
      cockpit-migrate:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      API_HEALTHCHECK_URL: ${API_HEALTHCHECK_URL:?API_HEALTHCHECK_URL is required}
      CORS_ORIGIN: ${API_CORS_ORIGIN:?API_CORS_ORIGIN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-cockpit-api}
      # De worker draait als eigen service (cockpit-worker), niet in de API.
      SELECTIE_WORKER_ENABLED: "false"
      # Sleutel voor stekker-secrets uit stekkerbeheer (AES-256-GCM, 32 bytes base64).
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${API_TRAEFIK_ROUTER_NAME:-cockpit-api}.rule=Host(`${API_DOMAIN:?API_DOMAIN is required}`)"
      - "traefik.http.routers.${API_TRAEFIK_ROUTER_NAME:-cockpit-api}.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.${API_TRAEFIK_ROUTER_NAME:-cockpit-api}.tls=${TRAEFIK_TLS:-true}"
      - "traefik.http.routers.${API_TRAEFIK_ROUTER_NAME:-cockpit-api}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.${API_TRAEFIK_SERVICE_NAME:-cockpit-api}.loadbalancer.server.port=3000"
    networks:
      - traefik
      - database
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch(process.env.API_HEALTHCHECK_URL).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Worker (CC-7): hetzelfde image, eigen proces. Opschalen kan veilig
  # (docker compose up --scale cockpit-worker=2): werk wordt geclaimd met een lease.
  cockpit-worker:
    image: vernietigingscockpit-api:local
    depends_on:
      - cockpit-api
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SELECTIE_WORKER_INTERVAL_MS: ${SELECTIE_WORKER_INTERVAL_MS:-5000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-300000}
      # Archivering (CC-18): het dossierpakket per taak komt in dit volume.
      ARCHIEF_PAD: /archief
      # ADR-0006: beginwaarde bewaartermijn werkkopie en interval van de opschoning.
      WERKKOPIE_BEWAARTERMIJN: ${WERKKOPIE_BEWAARTERMIJN:-P12M}
      OPSCHONING_INTERVAL: ${OPSCHONING_INTERVAL:-P1D}
      # De worker maakt de vernietigingsverklaring (PDF/A-2b) via Gotenberg (CC-17).
      GOTENBERG_URL: ${GOTENBERG_URL:-}
      GOTENBERG_USERNAME: ${GOTENBERG_USERNAME:-}
      GOTENBERG_PASSWORD: ${GOTENBERG_PASSWORD:-}
      WORKER_POLL_START_MS: ${WORKER_POLL_START_MS:-2000}
      WORKER_POLL_MAX_MS: ${WORKER_POLL_MAX_MS:-60000}
      # OAuth2-secret van de teststekker; de naam staat in stekker_configuratie.secret_ref.
      KC_STEKKER_CLIENT_SECRET: ${KC_STEKKER_CLIENT_SECRET:-}
      # Sleutel voor stekker-secrets uit stekkerbeheer (AES-256-GCM, 32 bytes base64).
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
    networks:
      - traefik
      - database
    volumes:
      - archief:/archief
    restart: unless-stopped
    stop_grace_period: 60s

  cockpit-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: cockpit-web
      args:
        VITE_AUTH_ENABLED: ${WEB_AUTH_ENABLED:-true}
        VITE_OIDC_AUTHORITY: ${WEB_OIDC_AUTHORITY:?WEB_OIDC_AUTHORITY is required}
        VITE_OIDC_CLIENT_ID: ${WEB_OIDC_CLIENT_ID:-cockpit-web}
        VITE_OIDC_REDIRECT_URI: ${WEB_OIDC_REDIRECT_URI:?WEB_OIDC_REDIRECT_URI is required}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${WEB_OIDC_POST_LOGOUT_REDIRECT_URI:?WEB_OIDC_POST_LOGOUT_REDIRECT_URI is required}
        VITE_OIDC_SCOPE: ${WEB_OIDC_SCOPE:-openid profile email}
        VITE_API_BASE_URL: ${WEB_API_BASE_URL:?WEB_API_BASE_URL is required}
    image: vernietigingscockpit-web:local
    container_name: ${WEB_CONTAINER_NAME:-cockpit-web}
    environment:
      WEB_HEALTHCHECK_URL: ${WEB_HEALTHCHECK_URL:?WEB_HEALTHCHECK_URL is required}
      # Voor de Content-Security-Policy, ingevuld bij het starten van de container.
      WEB_OIDC_AUTHORITY: ${WEB_OIDC_AUTHORITY:?WEB_OIDC_AUTHORITY is required}
      WEB_API_BASE_URL: ${WEB_API_BASE_URL:?WEB_API_BASE_URL is required}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${WEB_TRAEFIK_ROUTER_NAME:-cockpit-web}.rule=Host(`${WEB_DOMAIN:?WEB_DOMAIN is required}`)"
      - "traefik.http.routers.${WEB_TRAEFIK_ROUTER_NAME:-cockpit-web}.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.${WEB_TRAEFIK_ROUTER_NAME:-cockpit-web}.tls=${TRAEFIK_TLS:-true}"
      - "traefik.http.routers.${WEB_TRAEFIK_ROUTER_NAME:-cockpit-web}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.${WEB_TRAEFIK_SERVICE_NAME:-cockpit-web}.loadbalancer.server.port=8080"
    networks:
      - traefik
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- \"$${WEB_HEALTHCHECK_URL}\" >/dev/null || exit 1"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  # Gearchiveerde vernietigingsdossiers (CC-18). Neem dit volume op in de back-up.
  archief:
    name: ${ARCHIEF_VOLUME:-cockpit-archief}

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
  database:
    name: ${DATABASE_NETWORK:-intern}
    external: true
