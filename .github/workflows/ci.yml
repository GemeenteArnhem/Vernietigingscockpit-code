name: CI

on:
  push:
    branches: [main, dev, dev5, dev6]
  pull_request:

jobs:
  # Licentie- en copyrightinformatie per bestand (REUSE, NeRDS-leidraad); zie REUSE.toml.
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: REUSE-controle
        uses: fsfe/reuse-action@v6

  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Alleen nodig voor `prisma generate`; er wordt geen verbinding gemaakt.
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Gelijk aan de runtime-image (node:22-alpine).
          node-version: 22
          cache: npm

      - run: npm ci

      # Stekkertypes (CC-19): gegenereerd uit de spec in de architectuurrepo. Deze stap faalt
      # als packages/stekker-client/src/stekker-api.ts niet meer overeenkomt met de spec.
      - name: Architectuurrepo uitchecken (stekkerspec)
        uses: actions/checkout@v4
        with:
          repository: GemeenteArnhem/Vernietigingscockpit
          # Stekker API v2 en MDTO (ADR-0005) staan op de branch dev van de architectuurrepo.
          ref: dev
          path: architectuur
          sparse-checkout: |
            designrules/api
            designrules/begrippenlijsten

      - name: Stekkertypes controleren tegen de spec
        run: npm run check:generated --workspace @vernietigingscockpit/stekker-client
        env:
          STEKKER_SPEC: ${{ github.workspace }}/architectuur/designrules/api/stekker-openapi-spec.yaml

      # Register Cockpit-selectielijsten (ADR-0008): gegenereerd uit de JSON in de architectuurrepo.
      - name: Selectielijstenregister controleren tegen de architectuurrepo
        run: npm run check:selectielijsten --workspace @vernietigingscockpit/cockpit-api
        env:
          SELECTIELIJSTEN_REGISTER: ${{ github.workspace }}/architectuur/designrules/begrippenlijsten/cockpit-selectielijsten.json

      - name: Prisma-client genereren
        run: npm run db:generate --workspace @vernietigingscockpit/cockpit-api

      # OpenAPI-specificatie van de cockpit-API (NeRDS-leidraad H4/H9): gegenereerd uit de code;
      # faalt als apps/cockpit-api/openapi.json niet meer bij de code past.
      - name: OpenAPI-specificatie controleren
        run: npm run check:openapi --workspace @vernietigingscockpit/cockpit-api

      - run: npm run typecheck
      - run: npm run lint
      # Tests met testdekking (NeRDS-leidraad 13.1): cockpit-api (unit + integratie in één run)
      # en cockpit-web (unit, pagina's en toegankelijkheid met axe). Faalt als de dekking onder
      # de drempels in apps/*/vitest.config.ts zakt.
      # Integratietests starten PostgreSQL via Testcontainers (Docker is beschikbaar op de runner).
      - name: Tests met testdekking
        run: npm run test:dekking

      - name: Testdekking in de samenvatting
        if: always()
        run: |
          for app in cockpit-api cockpit-web; do
            bestand=apps/$app/coverage/coverage-summary.json
            test -f "$bestand" || continue
            node -e '
              const t = require("./" + process.argv[1]).total;
              const regels = ["lines", "branches", "functions", "statements"]
                .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
              console.log(["### Testdekking " + process.argv[2], "", "| Soort | Dekking | Gedekt |", "|---|---|---|", ...regels, ""].join("\n"));
            ' "$bestand" "$app" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Dekkingsrapporten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dekkingsrapporten
          path: apps/*/coverage/
          if-no-files-found: ignore

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: controle
    env:
      # Vastgepinde versie van de teststekker; bijwerken bij een nieuwe stekker- of specversie.
      # dev2 met Stekker API v2 (MDTO), onderdelen (ADR-0007) en selectielijstcode (ADR-0008).
      STEKKER_COMMIT: cac00f0783ffd6bca24b96d769d0139ed492bb73
    steps:
      - uses: actions/checkout@v4

      - name: Teststekker uitchecken
        uses: actions/checkout@v4
        with:
          repository: GemeenteArnhem/Vernietigingscockpit-stekker-test
          ref: ${{ env.STEKKER_COMMIT }}
          path: stekker

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma-client genereren
        run: npm run db:generate --workspace @vernietigingscockpit/cockpit-api
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma?schema=public

      # E2E_BEHOUD=1: de omgeving blijft draaien voor de DAST-scan hieronder.
      - name: E2E (cockpit + teststekker met OAuth2 + nep-IdP)
        run: npm run test:e2e
        env:
          STEKKER_REPO: ${{ github.workspace }}/stekker
          E2E_BEHOUD: "1"

      # DAST (NeRDS-leidraad 6.1): passieve ZAP-baselinescan op de API van de E2E-omgeving,
      # zonder inloggen. Faalt alleen bij bevindingen met risico High; het rapport is een artifact.
      - name: ZAP-baselinescan op de API
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" zaproxy/zap-stable:2.17.0 \
            zap-baseline.py -t http://localhost:39700/api/v1 -I -J zap-rapport.json -r zap-rapport.html
          hoog=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' zap/zap-rapport.json)
          echo "Bevindingen met risico High: $hoog"
          test "$hoog" -eq 0

      - name: ZAP-rapport bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-rapport
          path: zap/
          if-no-files-found: ignore

      - name: E2E-omgeving opruimen
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.test.yml down -v --remove-orphans
        env:
          STEKKER_REPO: ${{ github.workspace }}/stekker
