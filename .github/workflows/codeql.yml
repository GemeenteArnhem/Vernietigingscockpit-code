# SAST (NeRDS-leidraad 6.1): statische code-analyse bij elke wijziging en wekelijks.
name: CodeQL

on:
  push:
    branches: [main, dev, dev5, dev6]
  pull_request:
  schedule:
    # Maandag 05:17 UTC; vangt nieuwe CodeQL-regels op ook als er niets verandert.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
